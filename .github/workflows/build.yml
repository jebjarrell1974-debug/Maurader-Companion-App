name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # WHY THIS EXISTS: AGP creates ~/.android/debug.keystore with a RANDOM key
      # when none is present, and every runner starts clean. That meant every
      # build was signed by a different key, so Android refused to install one
      # build over another ("App not installed" / "did not update").
      #
      # Preferred: the ANDROID_KEYSTORE_B64 secret, which is permanent.
      # Fallback: a cached keystore, which is stable until the cache is evicted
      # (GitHub drops caches unused for 7 days).
      - name: Restore cached debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Install signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "signing key: from repository secret (permanent)"
          elif [ -s ~/.android/debug.keystore ]; then
            echo "signing key: restored from cache (stable until the cache expires)"
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storetype PKCS12 -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "signing key: NEWLY GENERATED - you will have to uninstall before installing this build"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null \
            | grep "SHA256:" | head -1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Environment
        run: |
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(no platforms dir)"

      # Log downloads are blocked from the authoring sandbox, so failures are
      # re-emitted as a workflow annotation, which IS readable over the API.
      - name: Build and test
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python3 - <<'PY'
          import re
          log = open('build.log', errors='replace').read()
          # Prefer the compiler/Gradle error region over the trailing banner.
          m = re.search(r'(?:^e: |FAILURE: |What went wrong)', log, re.M)
          chunk = log[max(0, m.start()-2000):][:7000] if m else log[-7000:]
          enc = chunk.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f"::error title=BuildFailure::{enc}")
          PY
          fi
          exit $code

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/MarauderMobile-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarauderMobile-apk
          path: dist/*.apk
          if-no-files-found: error

      # Artifacts are served as a zip, which is painful to install from a phone.
      # A release asset is a direct .apk link that Android can open and install.
      - name: Publish APK to the rolling 'latest' release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.apk \
            --title "Latest build" \
            --notes "Debug APK from ${GITHUB_SHA::7}. Tap the .apk below to install."
