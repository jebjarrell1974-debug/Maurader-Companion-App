# Versions verified against Google/JetBrains documentation on 2026-10-21.
# Two constraints drive everything here:
#  * Compose 1.12.0+ REQUIRES compileSdk 37 and AGP 9. BOM 2026.09.00 -> 1.12.1,
#    so compileSdk 36 + this BOM is a hard failure. targetSdk is independent.
#  * AGP 9 has built-in Kotlin, so org.jetbrains.kotlin.android must NOT be
#    applied — it conflicts with the new DSL. kotlinOptions{} is likewise gone
#    (a hard compile error on KGP 2.4.x); jvmTarget defaults to
#    android.compileOptions.targetCompatibility instead.
#
# AGP 9.3.0 is chosen over 9.4.0 deliberately: Kotlin's own compatibility table
# tests AGP only up to 9.3.1, and 9.3 already supports API 37 (min is 9.1.1).
# If you move to AGP 9.4.0 you MUST also move Gradle to 9.6.0, never one alone.
[versions]
agp = "9.3.0"
gradle = "9.5.0"
kotlin = "2.3.0"

compileSdk = "37"
targetSdk = "36"
minSdk = "26"

composeBom = "2026.09.00"

androidxCore = "1.19.1"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
androidxDatastore = "1.2.1"
coroutines = "1.11.0"
usbSerial = "3.11.0"
junit = "4.13.2"

[libraries]
# NB: androidx.core:core-ktx is an EMPTY artifact since 1.19.0-alpha01 — its
# APIs were merged into androidx.core:core. New code depends on core.
androidx-core              = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "androidxLifecycle" }
androidx-lifecycle-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose  = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom       = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui                = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics       = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling        = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview= { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3         = { group = "androidx.compose.material3", name = "material3" }
androidx-datastore         = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
kotlinx-coroutines         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
usb-serial                 = { group = "com.github.mik3y", name = "usb-serial-for-android", version.ref = "usbSerial" }
junit                      = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Deliberately NO org.jetbrains.kotlin.android — AGP 9 supplies Kotlin itself.
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
